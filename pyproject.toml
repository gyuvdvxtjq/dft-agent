[project]
name = "dft-agent"
version = "0.1.0"
description = "DFT-Agent: autonomous planning/execution/diagnosis agent for Quantum ESPRESSO calculations"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
structures = ["ase>=3.22", "pymatgen>=2024.1"]
agent = ["langgraph>=0.2", "langchain-core>=0.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dft-agent = "dft_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dft_agent"]
